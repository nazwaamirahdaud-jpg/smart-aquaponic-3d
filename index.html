<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Aquaponic 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#d7d3ca}
#ui{position:fixed;z-index:2;top:20px;left:20px;background:#ffffffe8;padding:14px 18px;border-radius:10px;box-shadow:0 4px 16px #5555}
#ui b{font-size:18px}#ui small{display:block;color:#666;margin-top:4px}
</style>
</head>
<body>
<div id="ui"><b>SMART AQUAPONIC SYSTEM</b><small>Drag = rotate · Wheel = zoom · Right drag = pan</small></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

const S=new THREE.Scene(); S.background=new THREE.Color(0xd7d3ca);
const C=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
C.position.set(8,6,10);
const R=new THREE.WebGLRenderer({antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
document.body.appendChild(R.domElement);
const O=new THREE.OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,2.4,0);
S.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-5,10,8);sun.castShadow=true;S.add(sun);

const acrylic=new THREE.MeshPhysicalMaterial({color:0xeafaff,transparent:true,opacity:.25,transmission:.55,roughness:.08,thickness:.08,side:THREE.DoubleSide});
const water=new THREE.MeshPhysicalMaterial({color:0x4da5bd,transparent:true,opacity:.48,roughness:.05});
const soil=new THREE.MeshStandardMaterial({color:0x3b2417,roughness:1});
const green=new THREE.MeshStandardMaterial({color:0x3f963e,roughness:.8});
const black=new THREE.MeshStandardMaterial({color:0x17191a,roughness:.4});
const metal=new THREE.MeshStandardMaterial({color:0x777777,metalness:.8,roughness:.25});
const blue=new THREE.MeshStandardMaterial({color:0x075e78,roughness:.35});
const fishMat=new THREE.MeshStandardMaterial({color:0xc39c58,roughness:.4});
const tube=new THREE.MeshPhysicalMaterial({color:0xccebf0,transparent:true,opacity:.5,transmission:.5,roughness:.04});
const lamp=new THREE.MeshStandardMaterial({color:0xffd789,emissive:0xffa52e,emissiveIntensity:3});

function box(x,y,z,a,b,c,m,n=""){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.name=n;o.castShadow=true;o.receiveShadow=true;S.add(o);return o}
function cyl(x,y,z,r,h,m,rot){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),m);o.position.set(x,y,z);if(rot)o.rotation.copy(rot);S.add(o);return o}
function sph(x,y,z,a,b,c,m,n=""){let o=new THREE.Mesh(new THREE.SphereGeometry(1,20,12),m);o.position.set(x,y,z);o.scale.set(a,b,c);o.name=n;S.add(o);return o}
function hose(p){let c=new THREE.CatmullRomCurve3(p);S.add(new THREE.Mesh(new THREE.TubeGeometry(c,70,.065,12),tube))}
function fish(x,y,z,k=1){sph(x,y,z,.3*k,.11*k,.11*k,fishMat,"Fish");let t=new THREE.Mesh(new THREE.ConeGeometry(.12*k,.25*k,3),fishMat);t.position.set(x-.28*k,y,z);t.rotation.z=Math.PI/2;S.add(t);sph(x+.2*k,y+.05*k,z-.05*k,.018,.018,.018,black)}

box(0,-.35,0,8,.35,6,new THREE.MeshStandardMaterial({color:0x765039,roughness:.8}));

// LOWER FISH TANK
box(0,.05,0,5.8,.12,3.8,acrylic);
box(0,1.15,-1.9,5.8,2.25,.07,acrylic);
box(0,1.15,1.9,5.8,2.25,.07,acrylic);
box(-2.9,1.15,0,.07,2.25,3.8,acrylic);
box(2.9,1.15,0,.07,2.25,3.8,acrylic);
box(0,.92,0,5.55,1.65,3.55,water);

fish(-1.8,.8,.8,1);fish(-.7,.6,-.7,.8);fish(.4,1,.5,1.1);fish(1.5,.7,-.5,.8);fish(.5,.4,-1.1,.65);fish(-1.2,1.2,-1,.65);

// PUMP
box(.8,.35,-.8,.7,.45,.6,black,"WATER PUMP");

// UPPER PLANTER
box(0,2.25,0,5.15,.1,3.25,acrylic);
box(0,3,-1.63,5.15,1.65,.07,acrylic);
box(0,3,1.63,5.15,1.65,.07,acrylic);
box(-2.57,3,0,.07,1.65,3.25,acrylic);
box(2.57,3,0,.07,1.65,3.25,acrylic);
box(0,3.02,0,4.85,.9,3.05,soil);

// PLANTS
function plant(x,z,h){cyl(x,3.55+h/2,z,.025,h,green);for(let i=0;i<4;i++){let q=i%2?-.14:.14;sph(x+q,3.65+i*.16,z,.16,.045,.09,green)}}
plant(-1.8,-.9,.65);plant(-1,-.2,.9);plant(-.1,.6,.7);plant(.8,-.7,.95);plant(1.6,.4,.7);

// SENSORS
box(-1.8,2.8,-.95,.25,.32,.25,black,"TEMP SENSOR");
cyl(-1.8,2.25,-.95,.035,.8,metal);
box(1.35,3.75,.25,.25,.55,.08,metal,"SOIL MOISTURE SENSOR");
cyl(1.28,3.25,.25,.025,.8,metal);cyl(1.40,3.25,.25,.025,.8,metal);

// ARDUINO
box(3.75,.8,-.2,1.35,.18,1.05,blue,"ARDUINO");
box(4.47,.8,-.2,.25,.22,.4,metal);

// GROW LIGHT
box(0,5.45,0,4.6,.25,.5,metal);
for(let x=-1.8;x<=1.8;x+=.6)box(x,5.25,0,.25,.08,.25,lamp);
cyl(-2.15,4.55,0,.045,1.7,metal);cyl(2.15,4.55,0,.045,1.7,metal);
const glow=new THREE.PointLight(0xffb94e,7,8);glow.position.set(0,5.1,0);S.add(glow);

// HOSES LIKE THE REFERENCE
hose([new THREE.Vector3(.8,.55,-.8),new THREE.Vector3(.8,.4,-2.3),new THREE.Vector3(2.7,1.2,-2.2),new THREE.Vector3(2.7,3.4,-1.7)]);
hose([new THREE.Vector3(2.7,3.4,-1.7),new THREE.Vector3(2.7,4.9,-1.2),new THREE.Vector3(1.8,5.4,-.4),new THREE.Vector3(.7,5.25,.1)]);
hose([new THREE.Vector3(1.8,3.55,.4),new THREE.Vector3(2.5,3.4,.8),new THREE.Vector3(2.8,2.8,.8),new THREE.Vector3(2.8,1.5,.8)]);

const grid=new THREE.GridHelper(20,20,0x888888,0xaaaaaa);grid.position.y=-.17;S.add(grid);

function animate(){requestAnimationFrame(animate);O.update();R.render(S,C)}animate();
addEventListener("resize",()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
